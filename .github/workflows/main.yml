name: Windows-RDP

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Set up RDP
      run: |
        net user runneradmin MyPassword123!
        net localgroup administrators runneradmin /add
        echo RDP enabled
    - name: Keep server alive
      run: |
        echo Server running
        timeout 21600
